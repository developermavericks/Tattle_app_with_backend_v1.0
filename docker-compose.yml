version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tattle-db
    environment:
      POSTGRES_DB: tattle_db
      POSTGRES_USER: tattle_user
      POSTGRES_PASSWORD: tattle_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
